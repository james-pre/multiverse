name: Continuous Integration

on:
    push:
        branches:
            - main
    workflow_dispatch:
    workflow_call:
    pull_request:

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        container: fedora:latest
        permissions:
            contents: read
        steps:
            - name: Install native dependencies
              run: dnf install -y git gcc-c++ cmake make pkgconf-pkg-config gtk4-devel libadwaita-devel ucrt64-gcc-c++

            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build native bindings
              run: npm run build:native

            - name: Formatting
              run: npm run format:check

            - name: Linting
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            - name: Cache MSYS2 packages
              uses: actions/cache@v4
              with:
                  path: node_modules/.cache/girbind/win32-x64/.cache
                  key: msys2-${{ hashFiles('package.json') }}
                  restore-keys: msys2-

            - name: Build for Windows
              run: npm run build:windows
