name: Release

on:
    release:
        types: [published]

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml
        permissions:
            contents: read

    release:
        name: Publish
        runs-on: ubuntu-latest
        container: fedora:latest
        needs: ci
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Install native dependencies
              run: dnf install -y git gh gcc-c++ cmake make pkgconf-pkg-config gtk4-devel libadwaita-devel ucrt64-gcc-c++

            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest
                  registry-url: https://registry.npmjs.org/

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: |
                  npm run build:native
                  npm run build

            - name: Build for Windows
              run: npm run build:windows

            - name: Build single executables
              run: npm run build:sea

            - name: Publish GTK for Windows
              run: npm publish build/windows/runtime --access=public --provenance ${{ github.event.release.prerelease && '--tag next' || '' }}

            - name: Publish
              run: |
                  npm pkg set "optionalDependencies.@james-pre/multiverse-win32-x64=$(npm pkg get version | tr -d '"')"
                  npm publish --access=public --provenance ${{ github.event.release.prerelease && '--tag next' || '' }}

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >
                  gh release upload "${{ github.event.release.tag_name }}"
                  build/multiverse-linux-x64 build/multiverse-win-x64.exe --clobber --repo "$GITHUB_REPOSITORY"
